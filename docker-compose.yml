version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: doctor_booking_postgres
    restart: always
    environment:
      POSTGRES_DB: doctor_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doctor_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: doctor_booking_api
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: doctor_booking_db
      DB_USER: postgres
      DB_PASS: postgrespassword
      JWT_SECRET: super_secret_production_jwt_key_doctor_booking_2026
      JWT_EXPIRES_IN: 1d
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx sequelize-cli db:migrate && npx sequelize-cli db:seed:all && node src/server.js"

volumes:
  postgres_data:
